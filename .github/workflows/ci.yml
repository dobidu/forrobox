# Forró Box — CI: the gates this project's machine runs, on every push to main
# and every pull request (16-02). Each step calls the repo's own scripts rather
# than re-implementing them, so CI and a local run cannot drift apart.
#
#   linux-gate      scripts/validate-plugin.sh: pluginval on Linux Debug and
#                   Release, and the whole suite in Debug with every unexpected
#                   JUCE assertion a failure; the design cross-checks run as
#                   part of each build
#   linux-portable  scripts/build-linux-portable.sh: the Ubuntu 22.04 build, the
#                   glibc 2.35 floor read from the binaries, the suite on a clean
#                   22.04 (15-02)
#   windows         MSVC Release, the suite, no runtime DLL imported (15-01),
#                   pluginval
#   macos           universal AU/VST3/standalone for macOS 11+, ad-hoc signed;
#                   auval, pluginval, the suite (scripts/build-macos.sh, 17-01)
#
# On a `v*` tag the same three run, both platform jobs package with
# scripts/package-release.py (16-01), and `release` — only after all three pass,
# and the only job allowed to write — checks the tag against CMakeLists'
# version and opens a DRAFT GitHub release. Publishing is the maintainer's
# act (16-03). The tag rule and the version live in scripts/package-release.py
# (--check-tag), the JUCE tag in CMakeLists.txt (scripts/fetch-juce.sh).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxcomposite-dev libxrender-dev xvfb x11-utils
      - name: JUCE (the tag CMakeLists pins)
        run: scripts/fetch-juce.sh "$RUNNER_TEMP/JUCE"
      - name: Configure build-linux (Release)
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="$RUNNER_TEMP/JUCE"
      - name: Gate — pluginval Debug + Release, the Debug suite
        env:
          JUCE_PATH: ${{ runner.temp }}/JUCE
        run: scripts/headless-x.sh "$RUNNER_TEMP/JUCE" scripts/validate-plugin.sh
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-gate-logs
          path: build/pluginval/

  linux-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The tag matches CMakeLists' version (tag only — fails before any build)
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/package-release.py --check-tag "$GITHUB_REF_NAME"
      - name: JUCE (the tag CMakeLists pins)
        run: scripts/fetch-juce.sh "$RUNNER_TEMP/JUCE"
      - name: Portable build — the floor, the clean Ubuntu 22.04 suite
        env:
          JUCE_PATH: ${{ runner.temp }}/JUCE
        run: scripts/build-linux-portable.sh
      - name: Package (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/package-release.py --platform linux --artefacts build-portable/ForroBox_artefacts/Release --out dist
      - name: Upload package (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-linux
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: JUCE (the tag CMakeLists pins)
        run: scripts/fetch-juce.sh "$RUNNER_TEMP/JUCE"
      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DFORROBOX_TESTS=ON -DJUCE_PATH="$RUNNER_TEMP/JUCE"
      - name: Build (Release)
        run: cmake --build build --config Release --parallel
      - name: The suite
        timeout-minutes: 30
        run: |
          build/Release/ForroBoxTests.exe > suite.log 2>&1 || { tail -40 suite.log; exit 1; }
          result=$(grep -E "checks passed" suite.log | tail -1)
          echo "$result"
          grep -q "OK" <<<"$result" || { grep "  FAIL  " suite.log | head -40; exit 1; }
      - name: No runtime DLL imported
        env:
          OBJDUMP: llvm-objdump
        run: |
          scripts/check-pe-runtime.sh \
            build/ForroBox_artefacts/Release/VST3/ForroBox.vst3/Contents/x86_64-win/ForroBox.vst3 \
            build/ForroBox_artefacts/Release/Standalone/ForroBox.exe \
            build/Release/ForroBoxTests.exe
      - name: pluginval (strictness 10)
        run: scripts/validate-plugin.sh --windows build/ForroBox_artefacts/Release/VST3/ForroBox.vst3
      - name: Package (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/package-release.py --platform windows --artefacts build/ForroBox_artefacts/Release --out dist
      - name: Upload package (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-windows
          path: dist/
          if-no-files-found: error
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-logs
          path: |
            suite.log
            build/pluginval/

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: JUCE (the tag CMakeLists pins)
        run: scripts/fetch-juce.sh "$RUNNER_TEMP/JUCE"
      - name: Build, sign, auval, pluginval, the suite
        env:
          JUCE_PATH: ${{ runner.temp }}/JUCE
        run: scripts/build-macos.sh
      - name: Package (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/package-release.py --platform macos --artefacts build-macos/ForroBox_artefacts/Release --out dist
      - name: The unzipped bundles still verify (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        # A zip that dropped a signature file or an executable bit would ship
        # an AU that Apple Silicon refuses to load. So: unzip what ships and
        # check it the way build-macos.sh checked the build.
        run: |
          check="$RUNNER_TEMP/unzipped"; mkdir -p "$check"
          ditto -x -k dist/ForroBox-*-macos-universal.zip "$check"
          for b in "$check"/*/ForroBox.component "$check"/*/ForroBox.vst3 "$check"/*/ForroBox.app; do
            codesign --verify --deep --strict "$b"
            archs="$(lipo -archs "$b/Contents/MacOS/ForroBox")"
            [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]] || { echo "FATAL: $b is $archs"; exit 1; }
            echo "  unzipped, verified: $(basename "$b") ($archs)"
          done
      - name: Upload package (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-macos
          path: dist/
          if-no-files-found: error
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: macos-logs
          path: |
            build-macos/auval.log
            build-macos/suite.log
            build/pluginval/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-gate, linux-portable, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The tag matches CMakeLists' version
        id: version
        # Captured first: the default shell has no pipefail, so a failing check
        # piped straight into tee would leave this step green.
        run: |
          result=$(scripts/package-release.py --check-tag "$GITHUB_REF_NAME")
          echo "$result" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          scripts/package-release.py --checksums dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Forró Box ${{ steps.version.outputs.version }}")
          [[ "${{ steps.version.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            dist/ForroBox-*-linux-x64.tar.gz dist/ForroBox-*-windows-x64.zip \
            dist/ForroBox-*-macos-universal.zip dist/SHA256SUMS.txt
